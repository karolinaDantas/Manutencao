<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${solicitacao.id} ? 'Manutenção - Editar Solicitação' : 'Manutenção - Nova Solicitação'">Manutenção</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <h1 th:text="${solicitacao.id} ? 'Editar Solicitação' : 'Nova Solicitação'">Solicitação</h1>

    <form method="POST" th:object="${solicitacao}"
          th:action="${solicitacao.id} ? @{/manutencao/edit/{id}(id=${solicitacao.id})} : @{/manutencao/create}">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="item" class="form-label">Item</label>
            <input type="text" class="form-control" id="item" th:field="*{item}">
            <ul>
                <li th:each="error : ${#fields.errors('item')}" th:text="${error}" class="text-danger"></li>
            </ul>
        </div>

        <div class="mb-3">
            <label for="solicitante" class="form-label">Solicitante</label>
            <input type="text" class="form-control" id="solicitante" th:field="*{solicitante}">
            <ul>
                <li th:each="error : ${#fields.errors('solicitante')}" th:text="${error}" class="text-danger"></li>
            </ul>
        </div>

        <div class="mb-3">
            <label for="descricaoProblema" class="form-label">Descrição do Problema</label>
            <textarea class="form-control" id="descricaoProblema" rows="4" th:field="*{descricaoProblema}"></textarea>
            <ul>
                <li th:each="error : ${#fields.errors('descricaoProblema')}" th:text="${error}" class="text-danger"></li>
            </ul>
        </div>

        <button type="submit" class="btn btn-primary">Salvar</button>
        <a th:href="@{/manutencao}" class="btn btn-secondary">Cancelar</a>
    </form>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
