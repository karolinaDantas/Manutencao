<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manutenção - Excluir Solicitação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <h1>Excluir Solicitação</h1>

    <p>Tem certeza que deseja excluir a solicitação de manutenção do item
        <strong th:text="${solicitacao.item}"></strong>,
        aberta por <strong th:text="${solicitacao.solicitante}"></strong>?</p>

    <form th:action="@{/manutencao/delete/{id}(id=${solicitacao.id})}" method="POST">
        <button type="submit" class="btn btn-danger">Excluir</button>
        <a th:href="@{/manutencao}" class="btn btn-primary">Cancelar</a>
    </form>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
