<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manutenção - Solicitações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <h1>Solicitações de Manutenção</h1>

    <table class="table" th:unless="${#lists.isEmpty(solicitacoes)}">
        <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Item</th>
            <th scope="col">Solicitante</th>
            <th scope="col">Descrição do Problema</th>
            <th scope="col">Solicitado em</th>
            <th scope="col">Encerrado em</th>
            <th scope="col">Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="solicitacao : ${solicitacoes}">
            <th scope="row" th:text="${solicitacao.id}">---</th>
            <td th:text="${solicitacao.item}">---</td>
            <td th:text="${solicitacao.solicitante}">---</td>
            <td th:text="${solicitacao.descricaoProblema}">---</td>
            <td th:text="${#temporals.format(solicitacao.dataSolicitacao, 'dd/MM/yyyy HH:mm')}">---</td>
            <td th:text="${solicitacao.dataEncerramento} ? ${#temporals.format(solicitacao.dataEncerramento, 'dd/MM/yyyy HH:mm')} : '-'">---</td>
            <td>
                <form class="d-inline" th:action="@{/manutencao/finish/{id}(id=${solicitacao.id})}" method="POST">
                    <button type="submit" class="btn btn-sm btn-primary"
                            th:classappend="${solicitacao.concluida} ? 'disabled' : ''"
                            th:disabled="${solicitacao.concluida}">Concluir</button>
                </form>
                <a th:href="@{/manutencao/edit/{id}(id=${solicitacao.id})}"
                   class="btn btn-sm btn-secondary"
                   th:classappend="${solicitacao.concluida} ? 'disabled' : ''">Editar</a>
                <a th:href="@{/manutencao/delete/{id}(id=${solicitacao.id})}" class="btn btn-sm btn-danger">Excluir</a>
            </td>
        </tr>
        </tbody>
    </table>
    <p th:if="${#lists.isEmpty(solicitacoes)}">Nenhuma solicitação cadastrada.</p>

    <a th:href="@{/manutencao/create}" class="btn btn-sm btn-primary">Nova Solicitação</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
